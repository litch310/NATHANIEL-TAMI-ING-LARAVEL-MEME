name: Keep the site awake

# Render's free plan puts the site to sleep after 15 minutes without visitors.
# This visits the health check every 10 minutes so it stays awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the health check
        run: |
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 https://https-nathaniel-meme-onrender-com.onrender.com/up || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "The site did not answer with 200 after 3 tries."
          exit 1
